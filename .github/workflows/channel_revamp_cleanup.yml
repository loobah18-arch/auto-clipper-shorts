name: 🧹 Woo's Clips Channel Revamp Video Purge

on:
  workflow_dispatch:
    inputs:
      confirm_purge:
        description: 'Type "CONFIRM" to execute permanent deletion/privating of all channel videos'
        required: true
        default: 'CONFIRM'

permissions:
  contents: write

jobs:
  purge_videos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Google API Client
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: 🗑️ Purge or Private All Channel Videos
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python purge_channel_videos.py
