name: 🎬 Auto Podcast Clipper Shorts

on:
  schedule:
    # Runs twice daily at 08:00 and 20:00 UTC (100% free runner minutes)
    - cron: '0 8,20 * * *'
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct YouTube video URL to clip (leave blank for automatic rotation)'
        required: false
        type: string
      channel:
        description: 'Specific channel ID from catalog (e.g. lex_fridman, big_think, huberman_lab)'
        required: false
        type: string
      dry_run:
        description: 'Run pipeline without uploading to YouTube'
        required: false
        default: false
        type: boolean

concurrency:
  group: auto_clipper_pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clip_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    # Run the bgutil PO Token provider as a Docker service container.
    # The bgutil plugin in yt-dlp connects to this server at 127.0.0.1:4416
    # to automatically generate PO Tokens for YouTube requests.
    services:
      bgutil-provider:
        image: brainicism/bgutil-ytdlp-pot-provider:latest
        ports:
          - 4416:4416

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 💾 Cache HuggingFace & Whisper Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-whisper-base-en-v1

      - name: 🦕 Set up Deno (JS runtime for yt-dlp)
        continue-on-error: true
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 🦕 Fallback Deno Setup if Needed
        run: |
          if ! command -v deno &> /dev/null; then
            echo "Installing Deno via direct script..."
            curl -fsSL https://deno.land/install.sh | sh || true
            echo "$HOME/.deno/bin" >> $GITHUB_PATH
          fi


      - name: 🎥 Install FFmpeg & System Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation aria2

      - name: ⬆️ Upgrade yt-dlp to latest
        run: pip install -U yt-dlp

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Verify PO Token Provider
        run: |
          echo "Checking bgutil PO Token server..."
          for i in 1 2 3 4 5; do
            if curl -sf http://127.0.0.1:4416/ping; then
              echo ""
              echo "✅ PO Token server is ready!"
              break
            fi
            echo "Waiting for server... (attempt $i)"
            sleep 5
          done

      - name: 🧪 Run Pipeline Unit Tests
        run: python test_pipeline.py

      - name: 🚀 Run Auto-Clipper Pipeline
        id: run_pipeline
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VIDEO_MODEL: ${{ secrets.MINIMAX_VIDEO_MODEL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          PRIVACY_STATUS: 'public'
          INPUT_VIDEO_URL: ${{ inputs.video_url }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$INPUT_VIDEO_URL" ] || [ -n "$INPUT_CHANNEL" ]; then
            echo "Running custom URL/Channel clip pipeline..."
            ARGS=()
            if [ -n "$INPUT_VIDEO_URL" ]; then ARGS+=(--url "$INPUT_VIDEO_URL"); fi
            if [ -n "$INPUT_CHANNEL" ]; then ARGS+=(--channel "$INPUT_CHANNEL"); fi
            if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
            python main.py "${ARGS[@]}" 2>&1 | tee pipeline_debug.log
          else
            echo "Running Tech Fact Short Generator (Neural TTS + Studio Visualizer)..."
            GEN_ARGS=()
            if [ "$INPUT_DRY_RUN" = "true" ]; then
              GEN_ARGS+=(--dry-run)
            fi
            python generate_tech_fact_short.py "${GEN_ARGS[@]}" 2>&1 | tee pipeline_debug.log
          fi

      - name: 📦 Upload Generated Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-tech-short
          path: |
            output/*.mp4
            output/*.jpg
          retention-days: 7
          if-no-files-found: ignore

      - name: 💾 Commit Updated History & State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
          echo "Syncing state to branch: $TARGET_BRANCH"
          git fetch origin "$TARGET_BRANCH" || true
          git pull --rebase origin "$TARGET_BRANCH" || true
          git add clip_history.json || true
          git commit -m "🤖 Auto-clip state update [skip ci]" || echo "No changes to commit"
          git push origin "HEAD:$TARGET_BRANCH" || echo "Push skipped or nothing to push"

