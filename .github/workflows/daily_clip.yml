name: 🎬 Auto Movie Explanation Shorts (MovieGyan Style)

on:
  schedule:
    # Runs twice daily at 08:15 and 20:15 UTC (off-peak minute prevents GitHub queue drops)
    - cron: '15 8,20 * * *'
  workflow_dispatch:
    inputs:
      movie_name:
        description: 'Specific movie name to explain (leave blank for automatic sequence continuation)'
        required: false
        type: string
      part:
        description: 'Specific part number (e.g. 1, 2, 3... leave blank for automatic sequence continuation)'
        required: false
        type: string
      lang:
        description: 'Narration language (en or hi)'
        required: false
        default: 'en'
        type: string
      voice:
        description: 'Neural voice override (e.g. en-US-ChristopherNeural or hi-IN-MadhurNeural)'
        required: false
        type: string
      dry_run:
        description: 'Run pipeline without uploading to YouTube'
        required: false
        default: false
        type: boolean
      privacy_status:
        description: 'YouTube privacy status for non-dry runs'
        required: false
        default: 'public'
        type: choice
        options:
          - 'public'
          - 'unlisted'
          - 'private'

concurrency:
  group: auto_clipper_pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clip_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    # Run the bgutil PO Token provider as a Docker service container.
    # The bgutil plugin in yt-dlp connects to this server at 127.0.0.1:4416
    # to automatically generate PO Tokens for YouTube requests.
    services:
      bgutil-provider:
        image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
        ports:
          - 4416:4416

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 💾 Cache HuggingFace & Whisper Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-whisper-base-en-v1

      - name: 💾 Cache Genuine Movie Files
        uses: actions/cache@v4
        with:
          path: cache
          key: ${{ runner.os }}-movie-cache-v1-${{ hashFiles('movie_catalog.json') }}
          restore-keys: |
            ${{ runner.os }}-movie-cache-v1-

      - name: 🦕 Set up Deno (JS runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 🦕 Verify Deno Setup
        run: |
          set -euo pipefail
          command -v deno
          deno --version


      - name: 🎥 Install FFmpeg & System Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-core aria2



      - name: 📦 Install Python Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Verify PO Token Provider
        run: |
          set -euo pipefail
          ready=false
          for attempt in 1 2 3 4 5 6; do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
              ready=true
              break
            fi
            echo "Waiting for PO Token provider (attempt ${attempt}/6)..."
            sleep 5
          done
          if [ "$ready" != "true" ]; then
            echo "PO Token provider did not become ready" >&2
            exit 1
          fi
          echo "PO Token provider is ready"

      - name: 🧪 Run Pipeline Unit Tests
        run: |
          set -euo pipefail
           python -m compileall -q generate_movie_short.py movie_video_engine.py movie_pipeline_state.py movie_quality.py test_workflow_contract.py

           python test_pipeline.py
           python test_movie_pipeline.py
           python test_workflow_contract.py


      - name: 🚀 Run Auto-Clipper Pipeline
        id: run_pipeline
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VIDEO_MODEL: ${{ secrets.MINIMAX_VIDEO_MODEL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          PRIVACY_STATUS: ${{ inputs.privacy_status || 'public' }}
          POT_PROVIDER_URL: 'http://127.0.0.1:4416'
          YT_DLP_POT_PROVIDER_URL: 'http://127.0.0.1:4416'
          ALLOW_PRIVATE_MEDIA_SOURCES: ${{ secrets.ALLOW_PRIVATE_MEDIA_SOURCES || 'false' }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          GDRIVE_FILE_NAME: ${{ secrets.GDRIVE_FILE_NAME }}
          MOVIE_BGM_PATH: ${{ secrets.MOVIE_BGM_PATH }}
          ALLOW_TRAILER_SEARCH: 'false'
          ALLOW_EXTERNAL_ARTWORK: 'false'
          INPUT_MOVIE_NAME: ${{ inputs.movie_name }}
          INPUT_PART: ${{ inputs.part }}
          INPUT_LANG: ${{ inputs.lang }}
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "🎬 Running Movie Explanation Shorts Generator (MovieGyan Style)..."
          ARGS=()
          if [ -n "$INPUT_MOVIE_NAME" ]; then ARGS+=(--movie "$INPUT_MOVIE_NAME"); fi
          if [ -n "$INPUT_PART" ]; then ARGS+=(--part "$INPUT_PART"); fi
          if [ -n "$INPUT_LANG" ]; then ARGS+=(--lang "$INPUT_LANG"); fi
          if [ -n "$INPUT_VOICE" ]; then ARGS+=(--voice "$INPUT_VOICE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python generate_movie_short.py "${ARGS[@]}" 2>&1 | tee pipeline_debug.log



      - name: 🧾 Capture Render Diagnostics
        if: always()
        run: |
          set -euo pipefail
          report="output/ffprobe_report.txt"
          : > "$report"
          for video in output/movie_short_*.mp4; do
            [ -e "$video" ] || continue
            {
              echo "FILE: $video"
              ffprobe -v error -show_streams -show_format -of json "$video"
            } >> "$report"
          done

      - name: 📦 Upload Generated Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-explanation-short
          path: |
            output/movie_short_*.mp4
            output/thumb_*.jpg
            output/*_subtitles_*.ass
            output/render_manifest_*.json
            output/ffprobe_report.txt
            pipeline_debug.log
          retention-days: 7
          if-no-files-found: warn

      - name: 💾 Commit Updated History & State
        if: always()
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
          git add movie_history.json
          if git diff --cached --quiet; then
            echo "No movie state changes to commit"
            exit 0
          fi
          git commit -m "🤖 Auto-clip movie state update [skip ci]"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

