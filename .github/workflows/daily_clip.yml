name: 🎬 Auto Movie Explanation Shorts (MovieGyan Style)

on:
  schedule:
    # Three source clips per week; each clip is published as a Short and a normal video.
    # The 48-hour spacing also satisfies the 24-hour minimum between clip groups.
    - cron: '15 8 * * 1,3,5'
  workflow_dispatch:
    inputs:
      movie_name:
        description: 'Specific movie name to explain (leave blank for automatic sequence continuation)'
        required: false
        type: string
      part:
        description: 'Specific part number (e.g. 1, 2, 3... leave blank for automatic sequence continuation)'
        required: false
        type: string
      lang:
        description: 'Narration language (en or hi)'
        required: false
        default: 'en'
        type: string
      voice:
        description: "Neural voice override (defaults to RecapKun / Bhaloo Ji voice: en-US-ChristopherNeural for Woo's Clips channel)"
        required: false
        default: 'en-US-ChristopherNeural'
        type: string
      dry_run:
        description: 'Run pipeline without uploading to YouTube'
        required: false
        default: false
        type: boolean
      profile:
        description: 'Output layout profile (cinerush_style [1:1 square], shorts_9x16 [9:16 vertical], or landscape [16:9 widescreen])'
        required: false
        default: 'cinerush_style'
        type: choice
        options:
          - 'cinerush_style'
          - 'shorts_9x16'
          - 'landscape'
      allow_unreviewed_rights:
        description: 'Allow publishing of unreviewed movie assets without manual review gate'
        required: false
        default: true
        type: boolean
      allow_duplicate:
        description: 'Allow re-running/regenerating an episode even if previously recorded in upload history'
        required: false
        default: false
        type: boolean
      set_visibility:
        description: 'Optional: comma-separated video IDs to change visibility (skips the normal pipeline)'
        required: false
        type: string
      privacy_status:
        description: 'YouTube privacy status for non-dry runs'
        required: false
        default: 'public'
        type: choice
        options:
          - 'unlisted'
          - 'private'
          - 'public'

concurrency:
  group: auto_clipper_pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clip_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    # Raw footage is sourced only from the authorized Google Drive map.
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 💾 Cache HuggingFace & Whisper Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-whisper-base-en-v1

      - name: 🔐 Restore Google Drive Map
        env:
          GDRIVE_MAP_B64: ${{ secrets.GDRIVE_MAP_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$GDRIVE_MAP_B64" ]; then
            echo "GDRIVE_MAP_B64 secret is required for Drive-only sourcing" >&2
            exit 1
          fi
          printf '%s' "$GDRIVE_MAP_B64" | base64 --decode > movie_gdrive_map.json
          python -c "import json;json.load(open('movie_gdrive_map.json'));print('Drive map decoded and valid')"

      - name: 💾 Cache Authorized Google Drive Movie Files
        uses: actions/cache@v4
        with:
          path: cache
          key: ${{ runner.os }}-gdrive-movie-cache-v3-${{ hashFiles('movie_catalog.json', 'movie_gdrive_map.json') }}
          restore-keys: |
            ${{ runner.os }}-gdrive-movie-cache-v3-

      - name: 💾 Cache Generated Parts For Full Video Stitching
        uses: actions/cache@v4
        with:
          path: output/parts_cache
          key: ${{ runner.os }}-parts-cache-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-parts-cache-v1-

      - name: 🎥 Install FFmpeg & System Tools
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=a
          sudo -E apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends ffmpeg libass-dev fonts-montserrat fonts-dejavu-core fonts-liberation fonts-noto-core aria2



      - name: 📦 Install Python Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Pipeline Unit Tests
        run: |
          set -euo pipefail
          python -m compileall -q generate_movie_short.py cinerush_pipeline.py cinerush_downloader.py cinerush_face_reframer.py cinerush_subtitles.py cinerush_transcriber.py cinerush_viral_selector.py main.py
          python test_cinerush_pipeline.py
          python test_pipeline.py
          python test_movie_pipeline.py
          python test_workflow_contract.py
          python test_duration_and_rights_regression.py
          python test_movie_story_engine.py
          python test_cinematic_editor.py

      - name: 🗂️ Auto-Ingest Drive Catalog
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INPUT_LANG: ${{ inputs.lang }}
        run: |
          set -euo pipefail
          # Registers any Drive file that is not already a catalog entry, so new
          # movies/anime/series need no manual catalog editing. The generated
          # file is committed below, so scripts are written once and reused.
          if [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "GDRIVE_FOLDER_ID secret is not set; skipping auto-ingest."
            exit 0
          fi
          if [ ! -f movie_gdrive_map.json ]; then
            echo "No Drive map present; skipping auto-ingest."
            exit 0
          fi
          python movie_auto_catalog.py "${INPUT_LANG:-en}"

      - name: 🔁 Update Visibility Of Existing Videos
        if: inputs.set_visibility != '' && inputs.set_visibility != null
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          SET_VISIBILITY_IDS: ${{ inputs.set_visibility }}
          SET_VISIBILITY_STATUS: ${{ inputs.privacy_status }}
        run: |
          set -euo pipefail
          python set_video_visibility.py

      - name: 🚀 Run Auto-Clipper Pipeline
        if: inputs.set_visibility == '' || inputs.set_visibility == null
        id: run_pipeline
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VIDEO_MODEL: ${{ secrets.MINIMAX_VIDEO_MODEL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          PRIVACY_STATUS: ${{ inputs.privacy_status || 'public' }}
          ALLOW_PRIVATE_MEDIA_SOURCES: 'true'
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          GDRIVE_FILE_NAME: ${{ secrets.GDRIVE_FILE_NAME }}
          MOVIE_BGM_PATH: ${{ secrets.MOVIE_BGM_PATH || 'assets/bgm/aerohead_fragments_recap.mp3' }}
          BGM_VOLUME: '0.12'
          DEFAULT_VOICE: 'en-US-ChristopherNeural'
          ALLOW_TRAILER_SEARCH: 'false'
          ALLOW_EXTERNAL_ARTWORK: 'false'
          INPUT_MOVIE_NAME: ${{ inputs.movie_name }}
          INPUT_PART: ${{ inputs.part }}
          INPUT_LANG: ${{ inputs.lang }}
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_ALLOW_UNREVIEWED_RIGHTS: ${{ inputs.allow_unreviewed_rights }}
          INPUT_ALLOW_DUPLICATE: ${{ inputs.allow_duplicate }}
        run: |
          set -euo pipefail
          echo "🎬 Running Movie Explanation Shorts Generator (Cinematic Story Style)..."
          ARGS=()
          if [ -n "$INPUT_MOVIE_NAME" ]; then ARGS+=(--movie "$INPUT_MOVIE_NAME"); fi
          if [ -n "$INPUT_PART" ]; then ARGS+=(--part "$INPUT_PART"); fi
          if [ -n "$INPUT_LANG" ]; then ARGS+=(--lang "$INPUT_LANG"); fi
          if [ -n "$INPUT_VOICE" ]; then ARGS+=(--voice "$INPUT_VOICE"); fi
          if [ -n "${INPUT_PROFILE:-}" ]; then ARGS+=(--profile "$INPUT_PROFILE"); fi
          if [ "${INPUT_ALLOW_UNREVIEWED_RIGHTS:-true}" = "true" ]; then ARGS+=(--allow-unreviewed-rights); fi
          if [ "${INPUT_ALLOW_DUPLICATE:-false}" = "true" ]; then ARGS+=(--allow-duplicate); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python generate_movie_short.py "${ARGS[@]}" 2>&1 | tee pipeline_debug.log

      - name: 🛡️ Multi-Agent Anti-Copyright Filter Verification
        if: always()
        run: |
          set -euo pipefail
          echo "🛡️ Verifying rendered artifacts against Multi-Agent Anti-Copyright Filter..."
          python movie_copyright_filter.py --verify-output output/

      - name: 🧾 Capture Render Diagnostics
        if: always()
        run: |
          set -euo pipefail
          report="output/ffprobe_report.txt"
          : > "$report"
          for video in output/*.mp4; do
            [ -e "$video" ] || continue
            {
              echo "FILE: $video"
              ffprobe -v error -show_streams -show_format -of json "$video"
            } >> "$report"
          done

      - name: 📦 Upload Generated Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-explanation-short
          path: |
            output/movie_short_*.mp4
            output/cinerush_short_*.mp4
            output/*_full_*.mp4
            output/thumb_*.jpg
            output/*_subtitles_*.ass
            output/render_manifest_*.json
            output/render_report_*.json
            output/editing_manifest_*.json
            output/*.mp4
            output/*.jpg
            output/*.ass
            output/*.json
            output/ffprobe_report.txt
            pipeline_debug.log
          retention-days: 7
          if-no-files-found: warn

      - name: 💾 Commit Updated History & State
        if: always()
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
          git add movie_history.json
          if [ -f clip_history.json ]; then
            git add clip_history.json
          fi
          if [ -f movie_catalog_auto.json ]; then
            git add movie_catalog_auto.json
          fi
          if git diff --cached --quiet; then
            echo "No movie state changes to commit"
            exit 0
          fi
          git commit -m "🤖 Auto-clip movie state update [skip ci]"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

