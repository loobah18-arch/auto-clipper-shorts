name: 🎬 Auto Podcast Clipper Shorts

on:
  schedule:
    # Runs twice daily at 08:00 and 20:00 UTC (100% free runner minutes)
    - cron: '0 8,20 * * *'
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct YouTube video URL to clip (leave blank for automatic rotation)'
        required: false
        type: string
      channel:
        description: 'Specific channel ID from catalog (e.g. lex_fridman, big_think, huberman_lab)'
        required: false
        type: string
      dry_run:
        description: 'Run pipeline without uploading to YouTube'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  clip_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    # Run the bgutil PO Token provider as a Docker service container.
    # The bgutil plugin in yt-dlp connects to this server at 127.0.0.1:4416
    # to automatically generate PO Tokens for YouTube requests.
    services:
      bgutil-provider:
        image: brainicism/bgutil-ytdlp-pot-provider:latest
        ports:
          - 4416:4416

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 🎥 Install FFmpeg & System Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation aria2

      - name: ⬆️ Upgrade yt-dlp to latest
        run: pip install -U yt-dlp

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Verify PO Token Provider
        run: |
          echo "Checking bgutil PO Token server..."
          for i in 1 2 3 4 5; do
            if curl -sf http://127.0.0.1:4416/ping; then
              echo ""
              echo "✅ PO Token server is ready!"
              break
            fi
            echo "Waiting for server... (attempt $i)"
            sleep 5
          done

      - name: 🧪 Run Pipeline Unit Tests
        run: python test_pipeline.py

      - name: 🚀 Run Auto-Clipper Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          PRIVACY_STATUS: 'public'
          INPUT_VIDEO_URL: ${{ inputs.video_url }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$INPUT_VIDEO_URL" ]; then
            ARGS+=(--url "$INPUT_VIDEO_URL")
          fi
          if [ -n "$INPUT_CHANNEL" ]; then
            ARGS+=(--channel "$INPUT_CHANNEL")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python main.py "${ARGS[@]}"

      - name: 💾 Commit Updated History & State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add clip_history.json
          git commit -m "🤖 Auto-clip state update [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or nothing to push"
