name: 🎬 Auto Movie Explanation Shorts (MovieGyan Style)

on:
  schedule:
    # Twice daily. Each run publishes exactly one part of the active movie, then
    # the state machine advances. Lands as 'public' unless you change the
    # privacy_status default below. Use set_visibility to change past uploads.
    - cron: '15 8,20 * * *'
  workflow_dispatch:
    inputs:
      movie_name:
        description: 'Specific movie name to explain (leave blank for automatic sequence continuation)'
        required: false
        type: string
      part:
        description: 'Specific part number (e.g. 1, 2, 3... leave blank for automatic sequence continuation)'
        required: false
        type: string
      lang:
        description: 'Narration language (en or hi)'
        required: false
        default: 'en'
        type: string
      voice:
        description: 'Neural voice override (default: en-US-AnaNeural cute female, or en-US-AvaNeural, hi-IN-SwaraNeural)'
        required: false
        default: 'en-US-AnaNeural'
        type: string
      dry_run:
        description: 'Run pipeline without uploading to YouTube'
        required: false
        default: false
        type: boolean
      set_visibility:
        description: 'Optional: comma-separated video IDs to change visibility (skips the normal pipeline)'
        required: false
        type: string
      privacy_status:
        description: 'YouTube privacy status for non-dry runs'
        required: false
        default: 'public'
        type: choice
        options:
          - 'unlisted'
          - 'private'
          - 'public'

concurrency:
  group: auto_clipper_pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clip_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    # Run the bgutil PO Token provider as a Docker service container.
    # The bgutil plugin in yt-dlp connects to this server at 127.0.0.1:4416
    # to automatically generate PO Tokens for YouTube requests.
    # Keep the image tag in sync with bgutil-ytdlp-pot-provider in requirements.txt.
    services:
      bgutil-provider:
        image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
        ports:
          - 4416:4416

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 💾 Cache HuggingFace & Whisper Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-whisper-base-en-v1

      - name: 🔐 Restore Google Drive Map
        env:
          GDRIVE_MAP_B64: ${{ secrets.GDRIVE_MAP_B64 }}
        run: |
          set -euo pipefail
          # The map holds private Drive file IDs, so it is never committed. It is
          # delivered as base64 and written here so the cache key can hash it.
          if [ -z "$GDRIVE_MAP_B64" ]; then
            echo "GDRIVE_MAP_B64 secret is not set; Google Drive sourcing stays disabled."
            exit 0
          fi
          printf '%s' "$GDRIVE_MAP_B64" | base64 --decode > movie_gdrive_map.json
          python -c "import json;json.load(open('movie_gdrive_map.json'));print('Drive map decoded and valid')"

      - name: 💾 Cache Genuine Movie Files
        uses: actions/cache@v4
        with:
          path: cache
          key: ${{ runner.os }}-movie-cache-v2-${{ hashFiles('movie_catalog.json', 'movie_gdrive_map.json') }}
          restore-keys: |
            ${{ runner.os }}-movie-cache-v2-
            ${{ runner.os }}-movie-cache-v1-

      - name: 💾 Cache Generated Parts For Full Video Stitching
        uses: actions/cache@v4
        with:
          path: output/parts_cache
          key: ${{ runner.os }}-parts-cache-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-parts-cache-v1-

      - name: 🦕 Set up Deno (JS runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 🦕 Verify Deno Setup
        run: |
          set -euo pipefail
          command -v deno
          deno --version


      - name: 🎥 Install FFmpeg & System Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-core aria2



      - name: 📦 Install Python Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Verify PO Token Provider
        run: |
          set -euo pipefail
          ready=false
          for attempt in 1 2 3 4 5 6; do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
              ready=true
              break
            fi
            echo "Waiting for PO Token provider (attempt ${attempt}/6)..."
            sleep 5
          done
          if [ "$ready" != "true" ]; then
            echo "PO Token provider did not become ready" >&2
            exit 1
          fi
          echo "PO Token provider is ready"

      - name: 🧩 Verify PO Token Plugin Installed
        run: |
          set -euo pipefail
          # A running server is useless without the yt-dlp plugin that talks to it.
          # Without the plugin, trailer downloads fail with a bot check and every
          # render silently degrades to the neutral motion background.
          if ! python -m pip show bgutil-ytdlp-pot-provider >/dev/null 2>&1; then
            echo "bgutil-ytdlp-pot-provider is not installed; trailer sourcing would fail" >&2
            exit 1
          fi
          python -m pip show bgutil-ytdlp-pot-provider | grep -E '^(Name|Version):'

      - name: 🧪 Run Pipeline Unit Tests
        run: |
          set -euo pipefail
          python -m compileall -q generate_movie_short.py movie_video_engine.py movie_pipeline_state.py movie_quality.py test_workflow_contract.py
          python test_pipeline.py
          python test_movie_pipeline.py
          python test_workflow_contract.py

      - name: 🗂️ Auto-Ingest Drive Catalog
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INPUT_LANG: ${{ inputs.lang }}
        run: |
          set -euo pipefail
          # Registers any Drive file that is not already a catalog entry, so new
          # movies/anime/series need no manual catalog editing. The generated
          # file is committed below, so scripts are written once and reused.
          if [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "GDRIVE_FOLDER_ID secret is not set; skipping auto-ingest."
            exit 0
          fi
          if [ ! -f movie_gdrive_map.json ]; then
            echo "No Drive map present; skipping auto-ingest."
            exit 0
          fi
          python movie_auto_catalog.py "${INPUT_LANG:-en}"

      - name: 🔁 Update Visibility Of Existing Videos
        if: inputs.set_visibility != '' && inputs.set_visibility != null
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          SET_VISIBILITY_IDS: ${{ inputs.set_visibility }}
          SET_VISIBILITY_STATUS: ${{ inputs.privacy_status }}
        run: |
          set -euo pipefail
          python set_video_visibility.py

      - name: 🚀 Run Auto-Clipper Pipeline
        if: inputs.set_visibility == '' || inputs.set_visibility == null
        id: run_pipeline
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VIDEO_MODEL: ${{ secrets.MINIMAX_VIDEO_MODEL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          PRIVACY_STATUS: ${{ inputs.privacy_status || 'public' }}
          YT_DLP_POT_PROVIDER_URL: 'http://127.0.0.1:4416'
          ALLOW_PRIVATE_MEDIA_SOURCES: ${{ secrets.ALLOW_PRIVATE_MEDIA_SOURCES || 'false' }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          GDRIVE_FILE_NAME: ${{ secrets.GDRIVE_FILE_NAME }}
          MOVIE_BGM_PATH: ${{ secrets.MOVIE_BGM_PATH || 'assets/bgm/cinematic_suspense_thriller.mp3' }}
          ALLOW_TRAILER_SEARCH: 'false'
          ALLOW_EXTERNAL_ARTWORK: 'false'
          INPUT_MOVIE_NAME: ${{ inputs.movie_name }}
          INPUT_PART: ${{ inputs.part }}
          INPUT_LANG: ${{ inputs.lang }}
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "🎬 Running Movie Explanation Shorts Generator (MovieGyan Style)..."
          ARGS=()
          if [ -n "$INPUT_MOVIE_NAME" ]; then ARGS+=(--movie "$INPUT_MOVIE_NAME"); fi
          if [ -n "$INPUT_PART" ]; then ARGS+=(--part "$INPUT_PART"); fi
          if [ -n "$INPUT_LANG" ]; then ARGS+=(--lang "$INPUT_LANG"); fi
          if [ -n "$INPUT_VOICE" ]; then ARGS+=(--voice "$INPUT_VOICE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python generate_movie_short.py "${ARGS[@]}" 2>&1 | tee pipeline_debug.log



      - name: 🧾 Capture Render Diagnostics
        if: always()
        run: |
          set -euo pipefail
          report="output/ffprobe_report.txt"
          : > "$report"
          for video in output/movie_short_*.mp4 output/*_full_*.mp4; do
            [ -e "$video" ] || continue
            {
              echo "FILE: $video"
              ffprobe -v error -show_streams -show_format -of json "$video"
            } >> "$report"
          done

      - name: 📦 Upload Generated Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-explanation-short
          path: |
            output/movie_short_*.mp4
            output/*_full_*.mp4
            output/thumb_*.jpg
            output/*_subtitles_*.ass
            output/render_manifest_*.json
            output/ffprobe_report.txt
            pipeline_debug.log
          retention-days: 7
          if-no-files-found: warn

      - name: 💾 Commit Updated History & State
        if: always()
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
          # The generated catalog is absent on runs that registered nothing, and
          # a bare pathspec for a missing file aborts the step.
          git add movie_history.json
          if [ -f movie_catalog_auto.json ]; then
            git add movie_catalog_auto.json
          fi
          if git diff --cached --quiet; then
            echo "No movie state changes to commit"
            exit 0
          fi
          git commit -m "🤖 Auto-clip movie state update [skip ci]"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

