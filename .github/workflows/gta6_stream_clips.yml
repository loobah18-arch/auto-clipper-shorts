name: 🎮 Woo's Clips — GTA 6 Stream Highlight Pipeline (2-Hour Cadence)

# Upload stream clips of GTA 6 to woo's clips (@woosclips) every 2 hours,
# prioritizing IShowSpeed streams (today & tomorrow).
on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours (00:00, 02:00, 04:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 UTC)

  workflow_dispatch:
    inputs:
      game:
        description: 'Game: gta6 (default)'
        default: 'gta6'
      streamers:
        description: 'Streamers priority file'
        default: 'streamers_ishowspeed.txt'
      count:
        description: 'How many new streams/videos to clip'
        default: '1'
      top:
        description: 'Shorts per stream/video'
        default: '1'
      min_views:
        description: 'Minimum view count gate'
        default: '1000'
      list_only:
        description: 'Only list what it would pick (no clipping)'
        type: boolean
        default: false
      upload_to_youtube:
        description: 'Upload the best Short to YouTube (@woosclips)'
        type: boolean
        default: true
      force_upload:
        description: 'Skip the Candle Gate spacing protection (force immediate upload)'
        type: boolean
        default: false
      privacy:
        description: 'YouTube privacy'
        type: choice
        default: public
        options: [public, unlisted, private]

concurrency:
  group: woos-clips-gta6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: ⏱️ 2-Hour Spacing Pre-flight Gate (Layer 0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4

      - name: 2-Hour Upload Spacing Evaluation
        id: gate
        env:
          PREFLIGHT_BYPASS: ${{ github.event_name != 'schedule' }}
          MIN_UPLOAD_SPACING_HOURS: '2.0'
          MAX_INLINE_WAIT_HOURS: '0.4'
        run: |
          set -euo pipefail
          python3 preflight_gate.py

  clip-and-upload:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write   # saves state/processed.json, upload_history.json, candle_gate_state.json
    env:
      GAME: ${{ inputs.game || 'gta6' }}
      STREAMERS: ${{ inputs.streamers || 'streamers_ishowspeed.txt' }}
      COUNT: ${{ inputs.count || '1' }}
      TOP: ${{ inputs.top || '1' }}
      MIN_VIEWS: ${{ inputs.min_views || '1000' }}
      DO_UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload_to_youtube) || github.event_name == 'schedule' }}
      PRIVACY: ${{ inputs.privacy || 'public' }}
      MIN_UPLOAD_SPACING_HOURS: '2.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji
          pip install -U yt-dlp yt-dlp-ejs bgutil-ytdlp-pot-provider
          pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: 🛡️ Generate YouTube PO Token via Node.js
        id: pot_gen
        run: |
          set -uo pipefail
          echo "📦 Installing youtube-po-token-generator..."
          npm install -g youtube-po-token-generator 2>/dev/null || true

          POT_JSON=$(timeout 30 node -e "
            const { generate } = require('youtube-po-token-generator');
            generate().then(r => { console.log(JSON.stringify(r)); }).catch(e => { console.log('{}'); });
          " 2>/dev/null || echo '{}')

          PO_TOKEN=$(echo "$POT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('poToken',''))" 2>/dev/null || echo "")
          VISITOR_DATA=$(echo "$POT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('visitorData',''))" 2>/dev/null || echo "")

          if [ -n "$PO_TOKEN" ] && [ -n "$VISITOR_DATA" ]; then
            echo "✅ PO Token generated successfully (len=${#PO_TOKEN})"
            echo "po_token=$PO_TOKEN" >> "$GITHUB_OUTPUT"
            echo "visitor_data=$VISITOR_DATA" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ PO Token generation failed — starting bgutil Docker fallback"
            echo "po_token=" >> "$GITHUB_OUTPUT"
            echo "visitor_data=" >> "$GITHUB_OUTPUT"
            docker run -d --name bgutil-provider --restart always -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider 2>/dev/null || true
            for i in {1..10}; do
              curl -s http://127.0.0.1:4416/ping 2>/dev/null && echo "✅ bgutil Docker ready" && break
              sleep 1
            done
          fi

      - name: YouTube cookies (from repo secret)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "${YOUTUBE_COOKIES:-}" ]; then
            python3 - <<'PY'
          import base64, os
          raw = os.environ["YOUTUBE_COOKIES"].strip()
          text = raw if ("# Netscape" in raw or "\t" in raw) else base64.b64decode(raw).decode("utf-8")
          open("youtube_cookies.txt", "w", encoding="utf-8").write(text + "\n")
          PY
            echo "🍪 cookies ready"
          else
            echo "No YOUTUBE_COOKIES secret configured"
          fi

      - name: Download TwitchDownloaderCLI
        run: |
          URL=$(curl -s https://api.github.com/repos/lay295/TwitchDownloader/releases/latest | grep -o 'https://[^"]*CLI[^"]*Linux-x64.zip' | head -n 1)
          [ -z "$URL" ] && URL="https://github.com/lay295/TwitchDownloader/releases/download/1.55.2/TwitchDownloaderCLI-1.55.2-Linux-x64.zip"
          curl -sL "$URL" -o tdl.zip && unzip -q -o tdl.zip && chmod +x TwitchDownloaderCLI && rm -f tdl.zip

      - name: Find IShowSpeed / GTA 6 stream peak & render Short
        env:
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_PO_TOKEN: ${{ steps.pot_gen.outputs.po_token }}
          YT_VISITOR_DATA: ${{ steps.pot_gen.outputs.visitor_data }}
        run: |
          ARGS=(--game "$GAME" --count "$COUNT" --top "$TOP" --min-views "$MIN_VIEWS" --streamers "$STREAMERS" --tdl ./TwitchDownloaderCLI --out clips)
          [ "${{ inputs.list_only }}" = "true" ] && ARGS+=(--list)
          python3 auto_clips.py "${ARGS[@]}" || echo "No Shorts this time"
          rm -f youtube_cookies.txt
          ls -lhR clips/ 2>/dev/null | head -50

      - name: Upload Shorts as artifact
        if: ${{ hashFiles('clips/**/*.mp4') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: auto-shorts
          path: |
            clips/**/*.mp4
            clips/posts.json
          retention-days: 7

      - name: Publish Short to YouTube (@woosclips)
        if: ${{ env.DO_UPLOAD == 'true' && hashFiles('clips/posts.json') != '' && !inputs.list_only }}
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          MIN_UPLOAD_SPACING_HOURS: '2.0'
        run: |
          EXTRA=()
          [ "${{ inputs.force_upload }}" = "true" ] && EXTRA+=(--force)
          RC=0
          python3 youtube_uploader.py --posts clips/posts.json --max 1 --privacy "$PRIVACY" --creator ishowspeed "${EXTRA[@]}" || RC=$?
          if [ "$RC" -eq 2 ]; then echo "⏸️ Upload deferred by the Candle Gate (protecting the last Short)."
          elif [ "$RC" -ne 0 ]; then exit $RC; fi

      - name: Save state (clipped videos, upload history, candle gate)
        if: ${{ always() && !inputs.list_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/processed.json upload_history.json candle_gate_state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No state changes"; exit 0; fi
          git commit -m "🤖 Update GTA 6 highlight stream state & upload history [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
