name: 🎬 Hypit Cloud Render & YouTube Upload Pipeline

on:
  schedule:
    # 12-hour evaluation cadence: runs at 02:00 UTC and 14:00 UTC (7:30 AM & 7:30 PM IST)
    - cron: '0 2,14 * * *'

  workflow_dispatch:
    inputs:
      creator:
        description: 'Target creator to clip (auto = next in rotation)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'mrbeast'
          - 'nileblue'
          - 'mark_rober'
          - 'ishowspeed'
          - 'ruhi_cenet'
      manifest:
        description: 'Path to Hypit manifest (optional override, leave blank for creator SVML)'
        required: false
        default: ''
        type: string
      output_filename:
        description: 'Name of output video file (optional override, leave blank for auto-naming)'
        required: false
        default: ''
        type: string
      upload_to_youtube:
        description: 'Enable automatic upload to YouTube (@woosclips)'
        required: false
        default: true
        type: boolean
      privacy_status:
        description: 'YouTube video privacy status'
        required: false
        default: 'public'
        type: choice
        options:
          - 'public'
          - 'unlisted'
          - 'private'
      force_upload:
        description: 'Force upload bypassing 48-Hour Candle Gate'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  hypit_build_render_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🟢 Set up Node.js (JS Runtime for YouTube n-challenge)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🎥 Install FFmpeg & Fonts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-montserrat

      - name: 📦 Install Python Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp yt-dlp-ejs bgutil-ytdlp-pot-provider

      - name: 🧪 Run Hypit & Packaging Unit Tests
        run: |
          set -euo pipefail
          python3 test_hypit_engine.py
          python3 test_candle_gate.py
          python3 test_catalog.py
          python3 test_youtube_uploader.py
          python3 test_crawler.py

      - name: 🔄 Resolve Creator Rotation & Backlog Upload
        id: resolve
        run: |
          set -euo pipefail
          python3 -c "
          import os
          from youtube_uploader import resolve_next_creator_rotation
          from creator_backlog_crawler import select_target_upload

          manual_creator = '${{ inputs.creator }}'.strip()
          manual_manifest = '${{ inputs.manifest }}'.strip()
          manual_output = '${{ inputs.output_filename }}'.strip()

          if manual_creator and manual_creator != 'auto':
              creator = manual_creator
          else:
              rot = resolve_next_creator_rotation()
              creator = rot['creator_id']

          selection = select_target_upload(creator)
          manifest = manual_manifest if manual_manifest else selection['svml_source']
          out_name = manual_output if manual_output else selection['output_filename']
          source_vid = selection['source_video']
          title = selection['formatted_title']

          print(f'🎯 Selected Creator: {creator} ({selection[\"creator_name\"]})')
          print(f'🎬 Selection Mode: {selection[\"selection_mode\"]} (Backlog Index: {selection[\"backlog_index\"]})')
          print(f'📺 Target Source Video: {source_vid[\"title\"]} [{source_vid[\"video_id\"]}]')
          print(f'📄 Manifest: {manifest}')
          print(f'📦 Output filename: {out_name}')
          print(f'✨ Formatted Title: {title}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'creator={creator}\n')
              f.write(f'manifest={manifest}\n')
              f.write(f'output_filename={out_name}\n')
              f.write(f'source_video_id={source_vid[\"video_id\"]}\n')
              f.write(f'source_video_url={source_vid[\"url\"]}\n')
              f.write(f'formatted_title={title}\n')
          "

      - name: 🛡️ Generate YouTube PO Token via Node.js (Tier 2 Pre-flight)
        id: pot_gen
        run: |
          set -uo pipefail
          echo "📦 Installing youtube-po-token-generator..."
          npm install -g youtube-po-token-generator 2>/dev/null || true

          # Generate fresh PO token + visitor_data via headless Node.js
          POT_JSON=$(timeout 30 node -e "
            const { generate } = require('youtube-po-token-generator');
            generate().then(r => { console.log(JSON.stringify(r)); }).catch(e => { console.log('{}'); });
          " 2>/dev/null || echo '{}')

          PO_TOKEN=$(echo "$POT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('poToken',''))" 2>/dev/null || echo "")
          VISITOR_DATA=$(echo "$POT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('visitorData',''))" 2>/dev/null || echo "")

          if [ -n "$PO_TOKEN" ] && [ -n "$VISITOR_DATA" ]; then
            echo "✅ PO Token generated successfully (len=${#PO_TOKEN})"
            echo "po_token=$PO_TOKEN" >> "$GITHUB_OUTPUT"
            echo "visitor_data=$VISITOR_DATA" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ PO Token generation failed — Tier 2 will fallback to bgutil Docker"
            echo "po_token=" >> "$GITHUB_OUTPUT"
            echo "visitor_data=" >> "$GITHUB_OUTPUT"
            # Attempt bgutil Docker as secondary Tier 2 provider
            docker run -d --name bgutil-provider --restart always -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider 2>/dev/null || true
            for i in {1..10}; do
              curl -s http://127.0.0.1:4416/ping 2>/dev/null && echo "✅ bgutil Docker ready on :4416" && break
              sleep 1
            done
            pip install -U bgutil-ytdlp-pot-provider 2>/dev/null || true
          fi

      - name: 📥 Source Video Ingestion (4-Tier Cascading Fallback)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
          YT_PO_TOKEN: ${{ steps.pot_gen.outputs.po_token }}
          YT_VISITOR_DATA: ${{ steps.pot_gen.outputs.visitor_data }}
        run: |
          set -uo pipefail
          SOURCE_URL="${{ steps.resolve.outputs.source_video_url }}"
          CREATOR_ID="${{ steps.resolve.outputs.creator }}"
          RAW_FILE="raw_source_${CREATOR_ID}.mp4"
          echo "Attempting to download 90s source excerpt for $CREATOR_ID from: $SOURCE_URL"

          # 1. Verify pip-installed yt-dlp (has yt-dlp-ejs + bgutil plugin importable).
          # NOTE: do NOT shadow with the standalone wget binary — a PyInstaller
          # binary cannot import pip-installed packages (yt_dlp_ejs / yt_dlp_plugins).
          echo "yt-dlp version: $(yt-dlp --version)"

          # 2. Extract YOUTUBE_COOKIES secret if available
          COOKIE_ARGS=()
          if [ -n "${YOUTUBE_COOKIES:-}" ]; then
            python3 -c "import os, base64; raw = os.environ.get('YOUTUBE_COOKIES', '').strip(); (open('youtube_cookies.txt', 'w', encoding='utf-8').write(base64.b64decode(raw).decode('utf-8') if ('# Netscape' not in raw and '\t' not in raw and raw) else raw)) if raw else None"
            if [ -f youtube_cookies.txt ]; then
              COOKIE_ARGS=(--cookies youtube_cookies.txt)
              echo "🍪 Successfully decoded YOUTUBE_COOKIES secret to youtube_cookies.txt"
            fi
          fi

          # 3. Build PO Token args if generated in pre-flight step
          POT_ARGS=()
          if [ -n "${YT_PO_TOKEN:-}" ] && [ -n "${YT_VISITOR_DATA:-}" ]; then
            POT_ARGS=(
              --extractor-args "youtube:po_token=web.gvs+${YT_PO_TOKEN}"
              --extractor-args "youtube:visitor_data=${YT_VISITOR_DATA}"
            )
            echo "🎟️ PO Token args ready (len=${#YT_PO_TOKEN})"
          else
            echo "ℹ️ No PO Token available — Tier 2 will try with bgutil/cookies only"
          fi

          DOWNLOAD_SUCCESS=false

          # -------------------------------------------------------------
          # Tier 1: Residential Proxy Routing (if YOUTUBE_PROXY configured)
          # -------------------------------------------------------------
          if [ -n "${YOUTUBE_PROXY:-}" ]; then
            echo "🌐 [Tier 1] Attempting download via YOUTUBE_PROXY (residential IP)..."
            if yt-dlp -4 "$SOURCE_URL" \
              --proxy "$YOUTUBE_PROXY" \
              "${COOKIE_ARGS[@]}" \
              --js-runtimes node \
              --remote-components ejs:github \
              --download-sections "*00:00-01:30" \
              --force-keyframes-at-cuts \
              --format "bestvideo[height<=1080]+bestaudio/best[height<=1080]/18/b" \
              -o "$RAW_FILE" --socket-timeout 35; then
              if [ -f "$RAW_FILE" ] && [ $(stat -c%s "$RAW_FILE" 2>/dev/null || stat -f%z "$RAW_FILE" 2>/dev/null || echo 0) -gt 100000 ]; then
                DOWNLOAD_SUCCESS=true
                echo "✅ [Tier 1] Successfully downloaded source via Proxy: $RAW_FILE"
              fi
            fi
          else
            echo "ℹ️ [Tier 1] YOUTUBE_PROXY secret not configured. Skipping to Tier 2."
          fi

          # -------------------------------------------------------------
          # Tier 2: Node.js PO Token (youtube-po-token-generator) + web/mweb clients
          # Uses a fresh runtime-generated PO Token that YouTube accepts
          # from datacenter IPs when paired with a GVS-signed session
          # -------------------------------------------------------------
          if [ "$DOWNLOAD_SUCCESS" != "true" ] && [ ${#POT_ARGS[@]} -gt 0 ]; then
            echo "🎟️ [Tier 2] Attempting download with fresh Node.js PO Token + cookies (web/mweb)..."
            for client in "mweb" "web" "web_creator"; do
              echo "  🔄 Trying client=$client with PO Token..."
              if yt-dlp -4 "$SOURCE_URL" \
                "${COOKIE_ARGS[@]}" \
                "${POT_ARGS[@]}" \
                --js-runtimes node \
                --remote-components ejs:github \
                --extractor-args "youtube:player_client=${client}" \
                --download-sections "*00:00-01:30" \
                --force-keyframes-at-cuts \
                --format "bestvideo[height<=1080]+bestaudio/best[height<=1080]/18/b" \
                -o "$RAW_FILE" --socket-timeout 45; then
                if [ -f "$RAW_FILE" ] && [ $(stat -c%s "$RAW_FILE" 2>/dev/null || stat -f%z "$RAW_FILE" 2>/dev/null || echo 0) -gt 100000 ]; then
                  DOWNLOAD_SUCCESS=true
                  echo "✅ [Tier 2] Successfully downloaded source via PO Token + $client: $RAW_FILE"
                  break
                fi
              fi
            done
          fi

          # -------------------------------------------------------------
          # Tier 2b: bgutil Docker PO Token service (fallback if npm gen failed)
          # Only runs if the bgutil Docker was started in pre-flight
          # -------------------------------------------------------------
          if [ "$DOWNLOAD_SUCCESS" != "true" ]; then
            if curl -s http://127.0.0.1:4416/ping 2>/dev/null | grep -q "version"; then
              echo "🛡️ [Tier 2b] Attempting download with bgutil Docker PO Token (web/mweb)..."
              if yt-dlp -4 "$SOURCE_URL" \
                "${COOKIE_ARGS[@]}" \
                --js-runtimes node \
                --remote-components ejs:github \
                --extractor-args "youtube:player_client=web,mweb" \
                --download-sections "*00:00-01:30" \
                --force-keyframes-at-cuts \
                --format "bestvideo[height<=1080]+bestaudio/best[height<=1080]/18/b" \
                -o "$RAW_FILE" --socket-timeout 45; then
                if [ -f "$RAW_FILE" ] && [ $(stat -c%s "$RAW_FILE" 2>/dev/null || stat -f%z "$RAW_FILE" 2>/dev/null || echo 0) -gt 100000 ]; then
                  DOWNLOAD_SUCCESS=true
                  echo "✅ [Tier 2b] Successfully downloaded source via bgutil Docker: $RAW_FILE"
                fi
              fi
            fi
          fi

          # -------------------------------------------------------------
          # Tier 3: Apple VisionOS / iOS HLS Extraction (NO Cookies)
          # (Cookies cause yt-dlp to skip native Apple clients entirely)
          # -------------------------------------------------------------
          if [ "$DOWNLOAD_SUCCESS" != "true" ]; then
            echo "🍎 [Tier 3] Attempting download via VisionOS / iOS HLS client (without cookies)..."
            for client in "visionos" "ios" "android_vr"; do
              echo "🔄 Trying yt-dlp download with client: $client..."
              if yt-dlp -4 -v "$SOURCE_URL" \
                --js-runtimes node \
                --remote-components ejs:github \
                --extractor-args "youtube:player_client=$client" \
                --download-sections "*00:00-01:30" \
                --force-keyframes-at-cuts \
                --format "bestvideo[height<=1080]+bestaudio/best[height<=1080]/18/b" \
                -o "$RAW_FILE" --socket-timeout 35; then
                if [ -f "$RAW_FILE" ] && [ $(stat -c%s "$RAW_FILE" 2>/dev/null || stat -f%z "$RAW_FILE" 2>/dev/null || echo 0) -gt 100000 ]; then
                  DOWNLOAD_SUCCESS=true
                  echo "✅ [Tier 3] Successfully downloaded source via $client: $RAW_FILE"
                  break
                fi
              fi
            done
          fi

          # -------------------------------------------------------------
          # Tier 4: Pipeline Gate & Local Asset Fallback
          # -------------------------------------------------------------
          if [ "$DOWNLOAD_SUCCESS" = "true" ]; then
            echo "raw_video_flag=--raw-video $RAW_FILE" >> "$GITHUB_ENV"
          elif [ "$CREATOR_ID" = "mrbeast" ]; then
            echo "⚠️ MrBeast live download failed; using verified local MrBeast footage."
            echo "raw_video_flag=" >> "$GITHUB_ENV"
          else
            echo "❌ Fatal: Could not download authentic source video for $CREATOR_ID across all 4 tiers."
            echo "Aborting render to prevent mismatched footage assembly."
            exit 1
          fi

      - name: 🎬 Render Hypit Deliverable
        run: |
          set -euo pipefail
          mkdir -p output
          MANIFEST="${{ steps.resolve.outputs.manifest }}"
          CREATOR_ID="${{ steps.resolve.outputs.creator }}"
          OUTPUT_NAME="${{ steps.resolve.outputs.output_filename }}"
          python3 hypit_engine.py "$MANIFEST" --creator "$CREATOR_ID" $raw_video_flag --output "output/$OUTPUT_NAME"

      - name: 📦 Upload Generated Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypit-render-output
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: 🚀 Publish Short to YouTube (@woosclips)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.upload_to_youtube == true || inputs.upload_to_youtube == 'true')) }}
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          OUTPUT_NAME="${{ steps.resolve.outputs.output_filename }}"
          CREATOR_ID="${{ steps.resolve.outputs.creator }}"
          PRIVACY="${{ inputs.privacy_status || 'public' }}"
          EXTRA_ARGS=()
          if [ "${{ inputs.force_upload }}" = "true" ]; then
            EXTRA_ARGS+=(--force)
          fi

          UPLOAD_STATUS=0
          python3 youtube_uploader.py \
            --video "output/$OUTPUT_NAME" \
            --metadata metadata.json \
            --creator "$CREATOR_ID" \
            --source-id "${{ steps.resolve.outputs.source_video_id }}" \
            --title "${{ steps.resolve.outputs.formatted_title }}" \
            --privacy "$PRIVACY" \
            "${EXTRA_ARGS[@]}" || UPLOAD_STATUS=$?

          if [ "$UPLOAD_STATUS" -eq 2 ]; then
            echo "⏸️ Upload safely deferred by Candle Gate. Pipeline completed cleanly."
          elif [ "$UPLOAD_STATUS" -ne 0 ]; then
            echo "❌ Fatal error during YouTube upload (exit code $UPLOAD_STATUS)"
            exit $UPLOAD_STATUS
          fi

      - name: 💾 Commit Updated Upload State
        if: always() && (github.event_name == 'schedule' || inputs.upload_to_youtube == true)
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
          git add upload_history.json candle_gate_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "🤖 Update upload history & candle gate state [skip ci]"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
